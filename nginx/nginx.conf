events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream auth_service      { server auth-service:8001; }
    upstream core_service      { server core-service:8002; }
    upstream analytics_service { server analytics-service:8003; }
    upstream ml_service        { server ml-service:8004; }
    upstream frontend          { server frontend:3000; }

    server {
        listen 80;
        server_name _;

        # CORS preflight
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "*";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                return 204;
            }

            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Auth-сервис
        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Основной сервис
        location /api/core/ {
            proxy_pass http://core_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Аналитика
        location /api/analytics/ {
            proxy_pass http://analytics_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ML-сервис
        location /api/ml/ {
            proxy_pass http://ml_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Swagger docs за шлюзом
        location /docs/auth      { proxy_pass http://auth_service/docs; }
        location /docs/core      { proxy_pass http://core_service/docs; }
        location /docs/analytics { proxy_pass http://analytics_service/docs; }
        location /docs/ml        { proxy_pass http://ml_service/docs; }
    }
}
